[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "papers"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "lxml",
    "PyPDF2",
    "PySide6",
    "sqlalchemy",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
namespaces = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"
